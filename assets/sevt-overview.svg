<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="情境期望—价值理论 SEVT 核心知识图">
<defs>
  <style>
    .bg{fill:#f7f9fc}.ink{fill:#182438}.muted{fill:#52627a}.head{font:700 34px 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif}.sub{font:17px 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif}.t{font:700 23px 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif}.body{font:18px 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif}.sm{font:16px 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif}.cap{font:14px 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif}
  </style>
  <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#6b7f9c"/></marker>
</defs>
<rect class="bg" width="1200" height="900"/>
<rect x="28" y="24" width="1144" height="852" rx="25" fill="#fff" stroke="#d8e2f0" stroke-width="2"/>
<text x="64" y="84" class="head ink">情境期望—价值理论 · SEVT</text>
<text x="64" y="117" class="sub muted">核心问题：为什么人会选择、投入或放弃某个目标？</text>
<rect x="64" y="146" width="1072" height="112" rx="16" fill="#ecf3ff" stroke="#b4cbed"/>
<text x="88" y="179" class="t ink">情境与既有经验</text>
<text x="88" y="208" class="body muted">家庭与社会文化 · 学校/工作环境 · 过去的成功与失败 · 他人反馈 · 身份认同</text>
<text x="88" y="237" class="sm muted">它们影响主体能够看见哪些选择，以及如何理解自己的能力、价值和成本。</text>
<path d="M600 258V288" stroke="#6b7f9c" stroke-width="2" marker-end="url(#arr)"/>
<rect x="64" y="300" width="334" height="244" rx="16" fill="#f0f7ff" stroke="#8fc2e7" stroke-width="2"/>
<rect x="433" y="300" width="334" height="244" rx="16" fill="#f3efff" stroke="#b5a2ea" stroke-width="2"/>
<rect x="802" y="300" width="334" height="244" rx="16" fill="#fff6ea" stroke="#e9bf81" stroke-width="2"/>
<text x="88" y="343" class="t ink">① 成功预期</text>
<text x="88" y="379" class="body ink">“我认为自己能做好吗？”</text>
<text x="88" y="424" class="body muted">是对未来表现的主观判断，</text>
<text x="88" y="453" class="body muted">不等同于客观能力。</text>
<text x="88" y="497" class="sm muted">关键来源：经历、反馈、自我概念</text>
<text x="457" y="343" class="t ink">② 主观任务价值</text>
<text x="457" y="379" class="body ink">“为什么值得做？”</text>
<text x="457" y="421" class="body muted">内在价值：过程是否有趣</text>
<text x="457" y="453" class="body muted">效用价值：能帮助实现什么</text>
<text x="457" y="485" class="body muted">成就价值：对“我是谁”多重要</text>
<text x="826" y="343" class="t ink">③ 感知成本</text>
<text x="826" y="379" class="body ink">“需要付出什么代价？”</text>
<text x="826" y="421" class="body muted">努力成本：时间与精力</text>
<text x="826" y="453" class="body muted">机会成本：放弃其他选择</text>
<text x="826" y="485" class="body muted">情绪成本：压力与焦虑</text>
<path d="M231 544V579M600 544V579M969 544V579" stroke="#6b7f9c" stroke-width="2" marker-end="url(#arr)"/>
<rect x="64" y="590" width="1072" height="92" rx="15" fill="#e7f4f0" stroke="#80baab" stroke-width="2"/>
<text x="88" y="627" class="t ink">目标选择与投入</text>
<text x="88" y="656" class="body muted">选择什么 · 投入多少 · 是否坚持 · 任务表现与参与程度</text>
<path d="M600 682V709" stroke="#6b7f9c" stroke-width="2" marker-end="url(#arr)"/>
<rect x="64" y="720" width="1072" height="92" rx="15" fill="#f2f5fb" stroke="#bdcce0"/>
<text x="88" y="756" class="t ink">行动反馈 → 更新下一轮评价</text>
<text x="88" y="785" class="body muted">成功、失败和新体验可能改变成功预期、任务价值及感知成本。</text>
<path d="M1118 720V274H1148V202H1136" fill="none" stroke="#6b7f9c" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arr)"/>
<text x="64" y="852" class="cap muted">应用：区分“觉得做不到”“觉得不重要”“觉得代价太高”；边界：不能单独证明目标是否伦理上值得、是否自主。</text>
</svg>